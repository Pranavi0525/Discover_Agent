[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discovery-agent"
version = "0.1.0"
description = "Modular trust-based shopping discovery agent"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "langchain-google-genai>=2.1,<3",
  "langgraph>=0.6,<2",
  "python-dotenv>=1.0,<2",
  "mcp>=1.0,<2",
]

[project.optional-dependencies]
tavily = ["tavily-python>=0.5"]
ui = ["streamlit>=1.38,<2"]
guard = ["transformers>=4.40", "torch"]
semantic = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
